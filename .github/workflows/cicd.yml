name: CI/CD

on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only. The release job below opts in to write access because Fastlane pushes
# version commits, tags and the GitHub Release.
permissions:
  contents: read

jobs:
  build:
    name: Build & Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@e5517072e87f198d9533967ae13d97c11b604005 # v1.99.0
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Fastlane Build - Beta
        if: github.ref == 'refs/heads/staging'
        uses: maierj/fastlane-action@516faaa1c6c7b366ecd238b4e4608d286874dd94 # v3.0.0
        with:
          lane: 'beta'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fastlane Build - Production
        if: github.ref == 'refs/heads/main'
        uses: maierj/fastlane-action@516faaa1c6c7b366ecd238b4e4608d286874dd94 # v3.0.0
        with:
          lane: 'production'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
